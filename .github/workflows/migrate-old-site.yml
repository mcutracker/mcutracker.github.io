name: Migrate legacy MCU Tracker site

on:
  push:
    paths:
      - '.github/workflows/migrate-old-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Trigger legacy site migration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone legacy site
        run: git clone --depth 1 https://github.com/ovztur/ovztur.github.io.git /tmp/legacy-site

      - name: Copy legacy site into new repository
        run: |
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            /tmp/legacy-site/ ./

      - name: Update old repository and site URLs
        shell: python
        run: |
          from pathlib import Path

          replacements = [
              ('https://raw.githubusercontent.com/ovztur/ovztur.github.io', 'https://raw.githubusercontent.com/mcutracker/mcutracker.github.io'),
              ('https://api.github.com/repos/ovztur/ovztur.github.io', 'https://api.github.com/repos/mcutracker/mcutracker.github.io'),
              ('https://github.com/ovztur/ovztur.github.io', 'https://github.com/mcutracker/mcutracker.github.io'),
              ('ovztur/ovztur.github.io', 'mcutracker/mcutracker.github.io'),
              ('ovztur.github.io', 'mcutracker.github.io'),
          ]
          text_suffixes = {'.html', '.js', '.json', '.md', '.yml', '.yaml', '.toml', '.go', '.sql', '.txt', '.sha256', '.xml', '.css'}

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or '.github' in path.parts:
                  continue
              if path.suffix.lower() not in text_suffixes and path.name not in {'.nojekyll'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

      - name: Remove one-shot migration workflow
        run: rm -f .github/workflows/migrate-old-site.yml

      - name: Commit migrated site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes detected.'
            exit 0
          fi
          git commit -m 'Migrate MCU Tracker site from legacy repository'
          git push origin main
